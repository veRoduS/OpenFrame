name: Publish Android player

on:
  push:
    branches: [main]
    paths: ['player/version.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-android-player
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Repository settings may add reviewers to this environment if desired.
    environment: android-releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check && pnpm compatibility:check && pnpm test
        env:
          OPENFRAME_PYTHON: python3
      - name: Check whether this player version is already published
        id: existing
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          import {ANDROID_GITHUB_BASE} from './server/android-release-config.mjs';
          const {version} = JSON.parse(readFileSync('player/version.json', 'utf8'));
          const response = await fetch(`${ANDROID_GITHUB_BASE}/apks/${version}/release.json`, {redirect: 'error'});
          if (response.status !== 404 && !response.ok) throw new Error(`GitHub returned ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          if (response.ok) console.log(`Player ${version} is already published; bump player/version.json to publish a new APK.`);
          JS
      - uses: actions/setup-java@v5
        if: steps.existing.outputs.published != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK and existing release key
        if: steps.existing.outputs.published != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Configure the existing Android release keystore secret; do not create a replacement key.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/openframe-release.jks"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Build, verify, and publish the APK folder
        if: steps.existing.outputs.published != 'true'
        env:
          OPENFRAME_ANDROID_KEYSTORE: ${{ runner.temp }}/openframe-release.jks
          OPENFRAME_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          OPENFRAME_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENFRAME_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OPENFRAME_ANDROID_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build:android
      - name: Remove the temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openframe-release.jks"
