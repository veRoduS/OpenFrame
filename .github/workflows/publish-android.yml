name: Publish Android player

on:
  push:
    branches: [main]
    paths: ['player/version.json', '.github/workflows/publish-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-android-player
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Repository settings may add reviewers to this environment if desired.
    environment: android-releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check && pnpm compatibility:check && pnpm test
        env:
          OPENFRAME_PYTHON: python3
      - name: Check whether this player version is already published
        id: existing
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          import {ANDROID_GITHUB_BASE} from './server/android-release-config.mjs';
          const {version} = JSON.parse(readFileSync('player/version.json', 'utf8'));
          const response = await fetch(`${ANDROID_GITHUB_BASE}/apks/${version}/release.json`, {redirect: 'error'});
          if (response.status !== 404 && !response.ok) throw new Error(`GitHub returned ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          if (response.ok) console.log(`Player ${version} is already published; bump player/version.json to publish a new APK.`);
          JS
      - uses: actions/setup-java@v5
        if: steps.existing.outputs.published != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK and existing release key
        if: steps.existing.outputs.published != 'true'
        env:
          KEYSTORE_PRIMARY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_LEGACY: ${{ secrets.OPENFRAME_ANDROID_KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.OPENFRAME_ANDROID_STORE_PASSWORD }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'openframe-release.jks'
          pin = json.loads(pathlib.Path('player/android/release-signing.json').read_text())['certificateSha256']
          for variable, name in [('KEYSTORE_PRIMARY', 'ANDROID_KEYSTORE_BASE64'), ('KEYSTORE_LEGACY', 'OPENFRAME_ANDROID_KEYSTORE')]:
              try:
                  encoded = ''.join(os.environ.get(variable, '').split())
                  content = base64.b64decode(encoded, validate=True)
                  if not content:
                      continue
                  destination.write_bytes(content)
                  destination.chmod(0o600)
                  result = subprocess.run(['keytool', '-J-Duser.language=en', '-list', '-v', '-keystore', str(destination), '-storepass:env', 'RELEASE_STORE_PASSWORD'], capture_output=True, text=True)
                  # Validate the existing signer before choosing either alias.
                  if result.returncode == 0 and pin in result.stdout.lower().replace(':', ''):
                      print(f'Validated existing release key from {name}.')
                      break
              except (ValueError, OSError):
                  pass
          else:
              destination.unlink(missing_ok=True)
              raise SystemExit('Neither keystore alias contains a valid base64 keystore matching the existing signer and store password. Check android-releases environment secrets; provide file contents, not a file path. Do not create a replacement key.')
          PY
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Build, verify, and publish the APK folder
        if: steps.existing.outputs.published != 'true'
        env:
          OPENFRAME_ANDROID_KEYSTORE: ${{ runner.temp }}/openframe-release.jks
          OPENFRAME_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.OPENFRAME_ANDROID_STORE_PASSWORD }}
          OPENFRAME_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.OPENFRAME_ANDROID_KEY_ALIAS }}
          OPENFRAME_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.OPENFRAME_ANDROID_KEY_PASSWORD }}
          OPENFRAME_ANDROID_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build:android
      - name: Remove the temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openframe-release.jks"
