name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm version:check
      - run: pnpm compatibility:check
      - run: pnpm repository:check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Install and verify video test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: pnpm test
        env:
          OPENFRAME_PYTHON: python3
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: pnpm build
      - name: Check Pi shell syntax
        run: |
          bash -n player/install.sh
          bash -n player/firstboot.sh
          bash -n player/build-image.sh

  browser:
    name: Browser regressions (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure isolated browser tools
        run: |
          printf 'PLAYWRIGHT_TOOLS=%s/openframe-browser-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'OPENFRAME_PLAYWRIGHT=file://%s/openframe-browser-tools/node_modules/playwright/index.mjs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Install and verify video test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install isolated Playwright and Chromium
        run: |
          npm install --prefix "$PLAYWRIGHT_TOOLS" --no-audit --no-fund --ignore-scripts --save-exact playwright@1.58.2
          node "$PLAYWRIGHT_TOOLS/node_modules/playwright/cli.js" install --with-deps chromium
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const {chromium} = await import(process.env.OPENFRAME_PLAYWRIGHT);
          appendFileSync(process.env.GITHUB_ENV, `OPENFRAME_BROWSER_EXECUTABLE=${chromium.executablePath()}\n`);
          JS
      - run: pnpm build
      # Keep these sequential: each owns its temporary server/database/browser.
      - name: Media upload progress and persistence
        timeout-minutes: 4
        run: node tests/media-uploads.browser.mjs
      - name: Editor locks and image replacement
        timeout-minutes: 4
        run: node tests/editor-locks.browser.mjs
      - name: Player video decode and lifecycle
        timeout-minutes: 4
        run: node tests/player-video.browser.mjs
      - name: Player custom-font lifecycle
        timeout-minutes: 4
        run: node tests/player-fonts.browser.mjs
      - name: Editor custom-font lifecycle
        timeout-minutes: 4
        run: node tests/font-settings.browser.mjs
      - name: Player startup and browser timers
        timeout-minutes: 4
        run: node tests/player-startup.browser.mjs
      - name: Data feed widgets and live refresh
        timeout-minutes: 4
        run: node tests/data-feeds.browser.mjs
      - name: Split header widget cards
        timeout-minutes: 4
        run: node tests/data-cards.browser.mjs
      - name: Card typography and multi-layer arrangement
        timeout-minutes: 4
        run: node tests/card-layout.browser.mjs
      - name: Card goal thresholds and circle labels
        timeout-minutes: 4
        run: node tests/card-thresholds.browser.mjs
      - name: Application table ingestion and rendering
        timeout-minutes: 4
        run: node tests/data-tables.browser.mjs
      - name: Data connection reset and widget reconnection
        timeout-minutes: 4
        run: node tests/data-feed-reset.browser.mjs
      - name: Transition rendering and cleanup
        timeout-minutes: 4
        run: node tests/transitions.browser.mjs

  android:
    name: Android native JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Native integration tests start the real server with disposable data.
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run debug JVM tests without release signing
        working-directory: player/android
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest

  docker:
    name: Docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: openframe-ci
      OPENFRAME_BIND_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - name: Native architecture and image codec
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker compose exec -T -e EXPECTED_ARCH openframe node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import sharp from 'sharp';
          assert.equal(process.arch, process.env.EXPECTED_ARCH);
          const image = await sharp({create: {width: 8, height: 8, channels: 3, background: '#ffffff'}}).webp().toBuffer();
          assert.equal((await sharp(image).metadata()).format, 'webp');
          JS
      - name: Build native managed WireGuard helper
        run: |
          docker build -f Dockerfile.wireguard -t openframe-wireguard-ci .
          docker run --rm --entrypoint wg openframe-wireguard-ci --version
          WG_ENDPOINT=vpn.example.com:51820 docker compose -f compose.managed-vpn.yaml config --quiet
      - name: Health, version, UI, and initial setup
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import pkg from './package.json' with {type: 'json'};
          const base = 'http://127.0.0.1:3100';
          const health = await (await fetch(base + '/api/health')).json();
          assert.equal(health.ok, true);
          assert.equal(health.version, pkg.version);
          assert.equal((await fetch(base)).status, 200);
          assert.equal((await fetch(base + '/player/')).status, 200);
          const setup = await fetch(base + '/api/setup', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({password: 'openframe-ci-fixture-password'}),
          });
          assert.equal(setup.status, 409, 'The seeded administrator must block public setup');
          const logs = execFileSync('docker', ['compose', 'logs', 'openframe'], {encoding: 'utf8'});
          const initialPassword = logs.match(/Initial password: (\S+)/)?.[1];
          assert.ok(initialPassword, 'A fresh container must print its one-time administrator password');
          console.log(`::add-mask::${initialPassword}`);
          const login = await fetch(base + '/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: 'admin', password: initialPassword}),
          });
          assert.equal(login.ok, true, 'The generated administrator must be able to sign in');
          const cookie = login.headers.get('set-cookie')?.split(';')[0];
          assert.ok(cookie, 'Administrator sign-in must create a session');
          const auth = await (await fetch(base + '/api/auth', {headers: {cookie}})).json();
          assert.equal(auth.authenticated, true);
          assert.equal(auth.user.username, 'admin');
          assert.equal(auth.user.role, 'admin');
          JS
      - run: docker compose up -d --force-recreate --wait --wait-timeout 120
      - name: Administrator persists after replacement
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const auth = await (await fetch('http://127.0.0.1:3100/api/auth')).json();
          assert.equal(auth.setup, false);
          JS
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Remove disposable CI containers and data
        if: always()
        run: docker compose down --volumes
