<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenFrame recovery</title>
    <link rel="stylesheet" href="/setup.css" />
    <script src="/recovery.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <span class="brand">OpenFrame</span><span class="badge">Recovery</span>
      </header>
      <h1>Reconnect your screen</h1>
      <section
        id="reconnect-controls"
        class="reconnect-controls"
        aria-label="Automatic reconnection"
      >
        <h2>Automatic reconnection</h2>
        <p id="reconnect-status" role="status">Checking connection...</p>
        <label for="pause-duration">Pause duration</label>
        <select id="pause-duration" disabled>
          <option value="60">1 minute</option>
          <option value="300" selected>5 minutes</option>
          <option value="900">15 minutes</option>
          <option value="indefinite">Indefinite</option>
        </select>
        <div class="reconnect-actions">
          <button id="pause-reconnects" type="button" disabled>
            Pause reconnects
          </button>
          <button
            id="resume-reconnects"
            type="button"
            class="secondary"
            disabled
          >
            Reconnect now
          </button>
        </div>
        <p id="pause-error" role="alert"></p>
      </section>
      <form id="recovery-form">
        <div class="network-heading">
          <h2>Saved Wi-Fi networks</h2>
          <span id="network-count"></span>
        </div>
        <ol id="networks" aria-label="Wi-Fi priority order"></ol>
        <button id="add-network" type="button" class="secondary" disabled>
          Add network
        </button>
        <label
          >Country code<input
            name="country"
            minlength="2"
            maxlength="2"
            pattern="[A-Z]{2}"
            required /></label
        ><button id="connect" disabled>Save networks</button>
        <button id="reload-networks" type="button" class="secondary">
          Reload saved networks
        </button>
      </form>
      <p id="error" role="alert"></p>
      <output id="result"></output>
    </main>
  </body>
</html>
